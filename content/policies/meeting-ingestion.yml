# Meeting Ingestion Policy
# Consumed by `scripts/lib/meeting-sync/config.mjs`:
#   - `./hey meeting import-notion` (requires NOTION_TOKEN in .env)
#   - `./hey meeting import-gmail`  (requires GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN in .env)
#   - `./hey meeting import-all`

defaults:
  default_project: CorePlatform
  default_owner: alice
  status: active

gmail:
  # Gmail search query for Gemini meeting notes emails
  query: 'from:gemini-notes@google.com subject:("Notes:" OR "회의록:") newer_than:30d'
  max_results: 25

notion:
  # Add the 32-char UUIDs of your Notion Meeting Notes databases here
  # (and share those databases with your Notion integration)
  known_databases: []
  page_size: 50

matching:
  dedup_window_hours: 12
  title_similarity_threshold: 0.45

# Map member keys (from content/vocab/members.yml) to their email addresses and Notion display names
# so imported meetings automatically resolve `owner` and `attendees`.
members:
  alice:
    gmail_addresses:
      - alice@example.com
    notion_people:
      - Alice
  bob:
    gmail_addresses:
      - bob@example.com
    notion_people:
      - Bob
